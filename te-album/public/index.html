<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TE 相册 · 我和 AI 的共同相册</title>
  <link rel="stylesheet" href="style.css?v=20260814-frontend" />
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">TE HOUSE / PRIVATE ALBUM</span><h1>我们的相册</h1></div>
    <div class="actions">
      <label class="button primary">上传照片<input id="file-input" type="file" accept="image/*" multiple hidden /></label>
      <button id="random-btn" class="button">随机翻</button>
      <button id="new-album-btn" class="button">新建相册</button>
      <button id="logout-btn" class="button ghost">退出</button>
    </div>
  </header>
  <main>
    <section id="login-panel" class="panel login">
      <p class="eyebrow">ONLY FOR TRISTEN</p><h2>这是你和 AI 共同拥有的地方。</h2>
      <p>照片默认私有，图片在浏览器端压缩后直达 Supabase。</p>
      <form id="login-form"><input id="email" type="email" placeholder="owner email" required /><input id="password" type="password" placeholder="password" required /><button class="button primary">进入相册</button><p id="login-error" class="error"></p></form>
    </section>
    <section id="app-panel" hidden>
      <nav id="view-tabs" class="view-tabs" aria-label="相册视图">
        <button class="tab active" data-view="all">全部照片</button>
        <button class="tab" data-view="favorites">收藏</button>
        <button class="tab" data-view="albums">相册</button>
        <button class="tab" data-view="trash">回收站</button>
      </nav>
      <section class="toolbar">
        <input id="search" placeholder="搜索标题、备注、文件名或 AI 描述…" />
        <span id="count" class="muted"></span>
      </section>
      <section id="album-panel" class="album-panel" hidden></section>
      <div id="upload-status" class="status" role="status"></div>
      <div id="gallery" class="gallery"></div>
      <div id="empty-state" class="empty" hidden></div>
    </section>
  </main>
  <dialog id="photo-dialog"><button class="close" id="close-dialog" aria-label="关闭">×</button><div id="photo-detail"></div></dialog>
  <script src="config.js"></script><script type="module" src="app.js?v=20260821-trash-random-fix"></script>
</body>
</html>
